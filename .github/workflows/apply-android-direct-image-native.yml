name: Apply Android Direct image receiver

on:
  push:
    branches: [feat/android-direct-image-native]

permissions:
  contents: write

concurrency:
  group: apply-android-direct-image-native
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/android-direct-image-native
          persist-credentials: true

      - name: Apply verified patch
        run: python3 .github/oaclix-temp/apply_runner.py

      - name: Remove temporary patch machinery
        run: rm -rf .github/oaclix-temp .github/workflows/apply-android-direct-image-native.yml

      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/oaclix-temp
          test ! -e .github/workflows/apply-android-direct-image-native.yml
          test -n "$(git status --short)"

      - name: Commit final Android Direct receiver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Android Direct image receiver'
          git push origin HEAD:feat/android-direct-image-native
