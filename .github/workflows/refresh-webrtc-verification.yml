name: Refresh WebRTC dependency verification

on:
  push:
    branches:
      - feat/android-direct-image-native
    paths:
      - .github/workflows/refresh-webrtc-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OACLIX_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/android-direct-image-native

      - name: Verify Gradle wrapper JAR
        working-directory: android
        run: echo "b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/oaclix-android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          tools_zip="commandlinetools-linux-15859902_latest.zip"
          tools_sha256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          tools_url="https://dl.google.com/android/repository/${tools_zip}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --output "$tmp_dir/$tools_zip" "$tools_url"
          echo "$tools_sha256  $tmp_dir/$tools_zip" | sha256sum -c -
          unzip -q "$tmp_dir/$tools_zip" -d "$tmp_dir/extracted"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -a "$tmp_dir/extracted/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android 16 SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve verified WebRTC dependency and compile
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --write-verification-metadata sha256 --no-daemon

      - name: Validate dependency metadata scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "android/gradle/verification-metadata.xml"
          grep -q 'android-prefixed-stripped' android/gradle/verification-metadata.xml
          grep -q '150.7871.01' android/gradle/verification-metadata.xml

      - name: Audit final tree and commit metadata
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-webrtc-verification.yml
          node scripts/audit-public-snapshot.mjs .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Verify Android WebRTC dependency"
          git push origin HEAD:feat/android-direct-image-native
