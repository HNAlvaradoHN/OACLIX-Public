name: Apply Direct capability isolation

on:
  push:
    branches:
      - feat/android-direct-image-native

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/android-direct-image-native

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Apply capability isolation
        run: |
          set -euo pipefail
          python3 scripts/apply-direct-capabilities.py
          python3 scripts/fix-direct-capability-isolation.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify web and Worker
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run build
          npm run audit:public

      - name: Commit verified capability isolation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-direct-capabilities.yml
          rm scripts/apply-direct-capabilities.py
          rm scripts/fix-direct-capability-isolation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate Direct transport capabilities"
          git push origin HEAD:feat/android-direct-image-native
