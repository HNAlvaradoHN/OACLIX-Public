name: Apply Gradle verification fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-gradle-verification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Add independently verified SHA-256 entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('android/gradle/verification-metadata.xml')
          text = path.read_text()

          additions = [
              (
                  '      <component group="com.google.guava" name="listenablefuture" version="9999.0-empty-to-avoid-conflict-with-guava">',
                  '      <component group="com.google.guava" name="guava-parent" version="33.3.1-jre">\n'
                  '         <artifact name="guava-parent-33.3.1-jre.pom">\n'
                  '            <sha256 value="55441db27e8869dfefe053059bdf478bdc7e95585642bf391f0023345fd56287" origin="Verified from Maven Central in public CI"/>\n'
                  '         </artifact>\n'
                  '      </component>\n'
                  '      <component group="com.google.guava" name="listenablefuture" version="9999.0-empty-to-avoid-conflict-with-guava">',
              ),
              (
                  '      <component group="org.junit" name="junit-bom" version="5.10.2">\n         <artifact name="junit-bom-5.10.2.pom">',
                  '      <component group="org.junit" name="junit-bom" version="5.10.2">\n'
                  '         <artifact name="junit-bom-5.10.2.module">\n'
                  '            <sha256 value="de23b114b3e4119a8fe6eb17bed5a3852816698bace67071579d6d927ebb080a" origin="Verified from Maven Central in public CI"/>\n'
                  '         </artifact>\n'
                  '         <artifact name="junit-bom-5.10.2.pom">',
              ),
              (
                  '      <component group="org.junit" name="junit-bom" version="5.11.0-M2">\n         <artifact name="junit-bom-5.11.0-M2.pom">',
                  '      <component group="org.junit" name="junit-bom" version="5.11.0-M2">\n'
                  '         <artifact name="junit-bom-5.11.0-M2.module">\n'
                  '            <sha256 value="86477abcf490d6ca059aa9973cb108d22a506f49d1a5569bb32cc6cbf43c2cce" origin="Verified from Maven Central in public CI"/>\n'
                  '         </artifact>\n'
                  '         <artifact name="junit-bom-5.11.0-M2.pom">',
              ),
          ]

          forbidden = [
              'guava-parent-33.3.1-jre.pom',
              'junit-bom-5.10.2.module',
              'junit-bom-5.11.0-M2.module',
          ]
          if any(name in text for name in forbidden):
              raise SystemExit('Target verification entries already exist; refusing duplicate patch')

          for old, new in additions:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one patch anchor, got {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          node scripts/audit-public-snapshot.mjs .
          git diff -- android/gradle/verification-metadata.xml

      - name: Commit verification metadata only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "android/gradle/verification-metadata.xml"
          git config user.name "HNAlvaradoHN"
          git config user.email "150305232+HNAlvaradoHN@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml
          git commit -m "Complete Gradle dependency verification"
          git push origin HEAD:main
