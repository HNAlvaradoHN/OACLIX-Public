name: Apply targeted General UI

on:
  push:
    branches:
      - feat/functional-convergence-1
    paths:
      - .github/workflows/functional-convergence-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: feat/functional-convergence-1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Wire targeted General UI
        run: python3 scripts/wire-targeted-general-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Run web and Worker tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit and commit verified UI wiring
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/functional-convergence-ui.yml scripts/wire-targeted-general-ui.py
          node scripts/audit-public-snapshot.mjs .
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/functional-convergence-ui.yml' 'scripts/wire-targeted-general-ui.py' 'src/App.tsx' 'src/components/ClipboardComposer.tsx' 'tests/generalTargetedUiWiring.test.ts' | sort)"
          test "$changed" = "$expected"
          git config user.name "HNAlvaradoHN"
          git config user.email "150305232+HNAlvaradoHN@users.noreply.github.com"
          git add src/App.tsx src/components/ClipboardComposer.tsx tests/generalTargetedUiWiring.test.ts
          git commit -m "Wire targeted General destination flow"
          git push origin HEAD:feat/functional-convergence-1
