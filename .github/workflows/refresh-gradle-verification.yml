name: Refresh Gradle verification metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-gradle-verification.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/oaclix-android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          tools_zip="commandlinetools-linux-15859902_latest.zip"
          tools_sha256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          tools_url="https://dl.google.com/android/repository/${tools_zip}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --output "$tmp_dir/$tools_zip" "$tools_url"
          echo "$tools_sha256  $tmp_dir/$tools_zip" | sha256sum -c -
          unzip -q "$tmp_dir/$tools_zip" -d "$tmp_dir/extracted"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -a "$tmp_dir/extracted/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Regenerate and verify Android dependency metadata
        working-directory: android
        run: ./gradlew --write-verification-metadata sha256 testDebugUnitTest assembleDebug --no-daemon

      - name: Audit and commit only the metadata refresh
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-public-snapshot.mjs .
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "android/gradle/verification-metadata.xml"
          git rm .github/workflows/refresh-gradle-verification.yml
          test "$(git status --short | wc -l)" -eq 2
          git config user.name "HNAlvaradoHN"
          git config user.email "150305232+HNAlvaradoHN@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml
          git commit -m "Refresh complete Gradle dependency verification"
          git push origin HEAD:main
